# Repairs for the PE_FW_Hardware_Specification_Catalogue_v1.xlsx issues found while building rooftool.
# Units after repair: *_tflops = TFLOPS or TOPS (dense), bw in GB/s, memory in GB, onchip in MB.
# Every value below is copied from the same sheet's Notes / Supported-Features text, unless marked.
# Delete an entry once the xlsx itself is fixed.
HW-CPU-002:
  reason: "Row shifted left by blank cells in the xlsx"
  set: {int8: 36, mem_type: "DDR5"}
  warn: "36 TOPS is overall peak INT8 (CPU+GPU+NPU), not CPU-only. Memory BW/power blank: pass --bw."
HW-GPU-001:
  reason: "Row shifted left by blank cells in the xlsx"
  set: {fp32: 8.1, fp16: 65, int8: 130, int4: 260, mem_gb: 16, mem_type: "GDDR6", bw_gbs: 320, tdp_w: 70}
  warn: "FP16 is the vendor mixed-precision figure; BW is '320+ GB/s' in the vendor page."
HW-GPU-003:
  reason: "SXM row stores the SPARSE figures (identical dense peaks to PCIe per NVIDIA A100 datasheet)"
  dense_factor: {tf32: 0.5, bf16: 0.5, fp16: 0.5, int8: 0.5}
  warn: "Sheet note says non-sparse, but values are 2x the PCIe row; halved to dense. Please verify."
HW-GPU-004:
  reason: "Sheet note says vendor values are WITH sparsity"
  dense_factor: {tf32: 0.5, bf16: 0.5, fp16: 0.5, fp8: 0.5, int8: 0.5}
  warn: "FP32 (67) left unscaled. Dense = sparse / 2."
HW-EDGE-001:
  reason: "BF16 column holds the FP16 dense figure per the Supported-Features text"
  move: {bf16: fp16}
  warn: "Sheet inconsistent: INT8 column=170 but text says dense INT8 up to 85 TOPS. Verify before trusting INT8/FP8. BW blank: pass --bw."
HW-EDGE-002:
  warn: "BW and power blank: pass --bw. Verify standard vs Super configuration."
HW-ACC-001:
  reason: "Row shifted left by blank cells in the xlsx"
  set: {mem_gb: 128, mem_type: "HBM2e", bw_gbs: 3700, onchip_mb: 96, tdp_w: 900}
  warn: "No peak compute in the sheet: pass --peak-gflops or fill the sheet."
HW-ACC-002:
  reason: "Row shifted; the value in the FP8 column is INT8 per the sheet's own note"
  set: {int8: 393, mem_gb: 16, mem_type: "HBM", bw_gbs: 819}
  warn: "BF16 peak missing from sheet. Per-chip values only."
